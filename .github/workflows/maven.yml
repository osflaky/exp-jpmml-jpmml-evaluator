name: maven

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - java: 21
          os: macos-latest
          arch: arm64
          runner: macos-latest
          expander_leg: macos-latest-21-arm64
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: ${{ matrix.distribution || 'zulu' }}
        java-version: ${{ matrix.java }}
        cache: 'maven'
    - run: mvn -B package --file pom.xml
    name: build [${{ matrix.expander_leg }}]
    timeout-minutes: 150
